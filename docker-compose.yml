version: '3.8'

services:
  bot:
    build: .
    container_name: x-automation-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./bot.db:/app/bot.db
      - ./temp_media:/app/temp_media
      - ./uploads:/app/uploads
